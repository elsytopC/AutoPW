name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter (e.g. @smoke, @regression, @api, @ui)'
        required: false
        default: ''
      project:
        description: 'UI browser project to run'
        required: false
        default: 'ui-chromium'
        type: choice
        options:
          - ui-chromium
          - ui-firefox
          - ui-webkit
          - ui-visual

jobs:
  ui-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Needs write access to push the Allure report to the gh-pages branch.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run mock contract tests
        run: npx playwright test --project=mock

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run accessibility checks
        run: npx playwright test --project=ui-a11y

      # Tag strategy:
      #   pull_request        -> @smoke only (fast feedback)
      #   push / schedule      -> full regression (no tag filter)
      #   workflow_dispatch    -> manual grep input
      - name: Run Playwright tests
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
          PROJECT: ${{ inputs.project }}
        run: |
          PROJECT="${PROJECT:-ui-chromium}"
          if [ -n "$GREP" ]; then
            npx playwright test --project="$PROJECT" --grep "$GREP"
          else
            npx playwright test --project="$PROJECT"
          fi

      # Pull the previous report (with its history/) from the gh-pages branch.
      # continue-on-error: on the very first run gh-pages does not exist yet.
      - name: Fetch previous Allure history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Generates the report and merges the previous history so trend charts
      # accumulate across runs. keep_reports caps how many runs we retain.
      - name: Build Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 30

      - name: Upload Allure report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-report-ui
          path: allure-history/
          retention-days: 7

      # Publish only on push to main so trends track the main branch over time
      # (PR runs would pollute history, and fork PRs cannot push anyway).
      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-report-ui
          path: test-results/junit.xml
          retention-days: 7

  visual-ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux baselines are produced by the "Update Visual Baselines" workflow.
      # Until they exist, skip gracefully instead of failing the build.
      - name: Check for Linux baselines
        id: baselines
        run: |
          if find tests/visual -name '*-linux.png' | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright (chromium)
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright test --project=ui-visual

      - name: Skip visual (no Linux baselines yet)
        if: steps.baselines.outputs.ready != 'true'
        run: echo "No Linux baselines found. Run the 'Update Visual Baselines' workflow to generate them."

      - name: Upload visual report
        uses: actions/upload-artifact@v6
        if: always() && steps.baselines.outputs.ready == 'true'
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  api-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PROD_AUTH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check required API secrets
        id: api_secrets
        run: |
          if [ -n "${API_BASE_URL}" ] && [ -n "${ADMIN_EMAIL}" ] && [ -n "${ADMIN_PASSWORD}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.api_secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps

      - name: Run API tests
        if: steps.api_secrets.outputs.ready == 'true'
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --project=api --grep "$GREP"
          else
            npx playwright test --project=api
          fi

      - name: Skip API tests (missing secrets)
        if: steps.api_secrets.outputs.ready != 'true'
        run: |
          echo "Skipping API CI: set API_BASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD secrets to enable this job."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always() && steps.api_secrets.outputs.ready == 'true'
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

  conduit-ci:
    # RealWorld is a public demo backend that can be slow or rate-limited, so
    # this job runs only nightly and on demand — its instability must never
    # block push/PR feedback.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Conduit API tests
        run: npx playwright test --project=conduit-api

      - name: Run Conduit UI tests
        run: npx playwright test --project=conduit-ui

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-conduit
          path: playwright-report/
          retention-days: 7