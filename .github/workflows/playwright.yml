name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter (e.g. @smoke, @regression, @api, @ui)'
        required: false
        default: ''
      project:
        description: 'UI browser project to run (ui-visual runs via the visual-ci job instead, gated on baseline availability)'
        required: false
        default: 'ui-chromium'
        type: choice
        options:
          - ui-chromium
          - ui-firefox
          - ui-webkit

jobs:
  ui-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allure-built: ${{ steps.upload-allure.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run lint
        run: npm run lint

      - name: Run contract tests
        run: npx playwright test --project=contract

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run accessibility checks
        run: npx playwright test --project=ui-a11y

      # Tag strategy:
      #   pull_request        -> @smoke only (fast feedback)
      #   push / schedule      -> full regression (no tag filter)
      #   workflow_dispatch    -> manual grep input
      - name: Run Playwright tests
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
          PROJECT: ${{ inputs.project }}
        run: |
          PROJECT="${PROJECT:-ui-chromium}"
          if [ -n "$GREP" ]; then
            npx playwright test --project="$PROJECT" --grep "$GREP"
          else
            npx playwright test --project="$PROJECT"
          fi

      - name: Fetch previous Allure history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: ${{ !cancelled() }}
        id: allure-report
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/history ]; then
            cp -R gh-pages/history/* allure-results/history/ || true
          fi
          npx allure generate allure-results -o allure-history --clean

      - name: Upload Allure report
        id: upload-allure
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.allure-report.outcome == 'success' }}
        with:
          name: allure-report-ui
          path: allure-history/
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-report-ui
          path: test-results/junit.xml
          retention-days: 7

  # Separate job so only the gh-pages publish step gets contents:write —
  # ui-ci itself only needs read access to run and report tests.
  publish-allure-report:
    needs: ui-ci
    if: >-
      ${{ !cancelled()
      && needs.ui-ci.outputs.allure-built == 'true'
      && github.event_name == 'push' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Allure report artifact
        uses: actions/download-artifact@v6
        with:
          name: allure-report-ui
          path: allure-history

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  visual-ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for Linux baselines
        id: baselines
        run: |
          if find tests/visual -name '*-linux.png' | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright (chromium)
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright test --project=ui-visual

      - name: Skip visual (no Linux baselines yet)
        if: steps.baselines.outputs.ready != 'true'
        run: echo "No Linux baselines found. Run the 'Update Visual Baselines' workflow to generate them."

      - name: Upload visual report
        uses: actions/upload-artifact@v6
        if: always() && steps.baselines.outputs.ready == 'true'
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  api-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PROD_AUTH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check required API secrets
        id: api_secrets
        run: |
          if [ -n "${API_BASE_URL}" ] && [ -n "${ADMIN_EMAIL}" ] && [ -n "${ADMIN_PASSWORD}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.api_secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps

      - name: Run API tests
        if: steps.api_secrets.outputs.ready == 'true'
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --project=api --grep "$GREP"
          else
            npx playwright test --project=api
          fi

      - name: Skip API tests (missing secrets)
        if: steps.api_secrets.outputs.ready != 'true'
        run: |
          echo "Skipping API CI: set API_BASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD secrets to enable this job."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always() && steps.api_secrets.outputs.ready == 'true'
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

  conduit-ci:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start Conduit stack (Docker)
        run: docker compose -f docker-compose.conduit.yml up -d --build --wait

      - name: Run Conduit API tests
        env:
          CONDUIT_API_URL: http://127.0.0.1:3000/api
          CONDUIT_UI_URL: http://127.0.0.1:4201
        run: npx playwright test --project=conduit-api --workers=2

      - name: Run Conduit authorization mock tests
        run: npx playwright test tests/contract/conduit/ --project=contract

      - name: Run Conduit UI tests
        env:
          CONDUIT_API_URL: http://127.0.0.1:3000/api
          CONDUIT_UI_URL: http://127.0.0.1:4201
        run: npx playwright test --project=conduit-ui --workers=2

      - name: Stop Conduit stack
        if: always()
        run: docker compose -f docker-compose.conduit.yml down -v

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-conduit
          path: playwright-report/
          retention-days: 7