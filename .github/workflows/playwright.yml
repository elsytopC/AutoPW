name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter (e.g. @smoke, @regression, @api, @ui)'
        required: false
        default: ''
      project:
        description: 'UI browser project to run (ui-visual runs via the visual-ci job instead, gated on baseline availability)'
        required: false
        default: 'ui-chromium'
        type: choice
        options:
          - ui-chromium
          - ui-firefox
          - ui-webkit

jobs:
  ui-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run contract tests
        run: npx playwright test --project=contract

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run accessibility checks
        run: npx playwright test --project=ui-a11y

      # Tag strategy:
      #   pull_request        -> @smoke only (fast feedback)
      #   push / schedule      -> full regression (no tag filter)
      #   workflow_dispatch    -> manual grep input
      - name: Run Playwright tests
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
          PROJECT: ${{ inputs.project }}
        run: |
          PROJECT="${PROJECT:-ui-chromium}"
          if [ -n "$GREP" ]; then
            npx playwright test --project="$PROJECT" --grep "$GREP"
          else
            npx playwright test --project="$PROJECT"
          fi

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-ui
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-report-ui
          path: test-results/junit.xml
          retention-days: 7

  # One report for the whole pipeline: every test job uploads raw
  # allure-results, this job merges them and adds gh-pages history so
  # trends survive between runs.
  allure-report:
    needs: [ui-ci, visual-ci, api-ci, conduit-ci]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.upload.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Allure results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Fetch previous Allure history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add history and run metadata
        id: metadata
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NAME: '${{ github.workflow }} #${{ github.run_number }}'
          RUN_NUMBER: ${{ github.run_number }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if ! ls allure-results/*-result.json >/dev/null 2>&1; then
            echo "No Allure results were uploaded by test jobs."
            echo "has-results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has-results=true" >> "$GITHUB_OUTPUT"

          mkdir -p allure-results/history
          if [ -d gh-pages/history ]; then
            cp -R gh-pages/history/* allure-results/history/ || true
          fi

          # Each job writes its own environment.properties; replace them with
          # one deterministic file describing the whole pipeline run.
          cat > allure-results/environment.properties <<EOF
          Branch=${BRANCH}
          Commit=${COMMIT}
          Event=${EVENT}
          Node=$(node --version)
          Todo.UI=https://demo.playwright.dev
          Conduit.UI.Docker=http://127.0.0.1:4201
          Conduit.API.Docker=http://127.0.0.1:3000/api
          EOF

          jq -n \
            --arg name "GitHub Actions" \
            --arg buildName "$RUN_NAME" \
            --arg buildOrder "$RUN_NUMBER" \
            --arg buildUrl "$RUN_URL" \
            --arg reportUrl "$REPORT_URL" \
            '{name: $name, type: "github", buildName: $buildName,
              buildOrder: ($buildOrder | tonumber), buildUrl: $buildUrl,
              reportUrl: $reportUrl}' \
            > allure-results/executor.json

      - name: Generate Allure report
        if: steps.metadata.outputs.has-results == 'true'
        run: npx allure generate allure-results -o allure-history --clean

      - name: Upload Allure report
        id: upload
        if: steps.metadata.outputs.has-results == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-history/
          retention-days: 7

  # Separate job so only the gh-pages publish step gets contents:write —
  # test and report jobs only need read access.
  publish-allure-report:
    needs: allure-report
    if: >-
      ${{ !cancelled()
      && needs.allure-report.outputs.built == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule') }}
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Allure report artifact
        uses: actions/download-artifact@v6
        with:
          name: allure-report
          path: allure-history

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  visual-ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for Linux baselines
        id: baselines
        run: |
          if find tests/visual -name '*-linux.png' | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright (chromium)
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        if: steps.baselines.outputs.ready == 'true'
        run: npx playwright test --project=ui-visual

      - name: Skip visual (no Linux baselines yet)
        if: steps.baselines.outputs.ready != 'true'
        run: echo "No Linux baselines found. Run the 'Update Visual Baselines' workflow to generate them."

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.baselines.outputs.ready == 'true' }}
        with:
          name: allure-results-visual
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual report
        uses: actions/upload-artifact@v6
        if: always() && steps.baselines.outputs.ready == 'true'
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  api-ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PROD_AUTH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check required API secrets
        id: api_secrets
        run: |
          if [ -n "${API_BASE_URL}" ] && [ -n "${ADMIN_EMAIL}" ] && [ -n "${ADMIN_PASSWORD}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.api_secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps

      - name: Run API tests
        if: steps.api_secrets.outputs.ready == 'true'
        env:
          GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --project=api --grep "$GREP"
          else
            npx playwright test --project=api
          fi

      - name: Skip API tests (missing secrets)
        if: steps.api_secrets.outputs.ready != 'true'
        run: |
          echo "Skipping API CI: set API_BASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD secrets to enable this job."

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.api_secrets.outputs.ready == 'true' }}
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always() && steps.api_secrets.outputs.ready == 'true'
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

  conduit-ci:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start Conduit stack (Docker)
        run: docker compose -f docker-compose.conduit.yml up -d --build --wait

      - name: Run Conduit API tests
        env:
          CONDUIT_API_URL: http://127.0.0.1:3000/api
          CONDUIT_UI_URL: http://127.0.0.1:4201
        run: npx playwright test --project=conduit-api --workers=2

      - name: Run Conduit UI tests
        env:
          CONDUIT_API_URL: http://127.0.0.1:3000/api
          CONDUIT_UI_URL: http://127.0.0.1:4201
        run: npx playwright test --project=conduit-ui --workers=2

      - name: Stop Conduit stack
        if: always()
        run: docker compose -f docker-compose.conduit.yml down -v

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-conduit
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-conduit
          path: playwright-report/
          retention-days: 7
