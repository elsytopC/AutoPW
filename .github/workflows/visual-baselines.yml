name: Update Visual Baselines

# Generates Linux screenshot baselines on the same OS as CI and commits them
# back to the triggering branch. Run this once to bootstrap baselines, and
# again after any intended UI change. Trigger from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npx playwright test --project=ui-visual --update-snapshots

      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain tests/visual)" ]; then
            git add tests/visual
            git commit -m "test: update linux visual baselines [skip ci]"
            git push
          else
            echo "No baseline changes to commit."
          fi
